# 来自 S2R 505b298 的 configs/experiments/E104_random_init_d1.yaml，2026-11-26 复制（机械改名：S2R_→PRJ_、包名 s2r→项目名）
# E104：D1 随机初始化对照（C1：M1–M3 同结构、随机权重，W4，meanpool，末层，5 个种子）（总纲 7.1）；评估与 E101/E103 相同
# 运行：scripts/s08_probe.py --exp configs/experiments/E104_random_init_d1.yaml
exp_id: E104_random_init_d1
dataset: d1
seed: 0

trials:
  keep_column: keep_W3          # S5 方案 C 的主分析保留标记
targets:
  y_cont:                       # 回归：block 内去漂移后的 ln MEP（S4 的 mep_resid）
    column: mep_resid
    task: regression
  y_bin:                        # 分类：在保留试验上、block 内中位数切分（高 = 1）
    column: mep_resid
    task: classification
    split: block_median

# 预测器 = 特征集合（列名前缀 / 列名，来自 S6 的 sub-XXX_classical.parquet）
# 预测器 = 同结构、不加载预训练权重的网络（C1），种子 0–4（总纲 4.2）；其余与 E103 相同
predictors:
  random_reve:
    type: embedding
    dir: random_init_reve
    window: W4
    pool: meanpool
    layers: [last]
    seeds: [0, 1, 2, 3, 4]
  random_labram:
    type: embedding
    dir: random_init_labram
    window: W4
    pool: meanpool
    layers: [last]
    seeds: [0, 1, 2, 3, 4]
  random_cbramod:
    type: embedding
    dir: random_init_cbramod
    window: W4
    pool: meanpool
    layers: [last]
    seeds: [0, 1, 2, 3, 4]

cv:
  outer: leave_one_block_out    # 6 折
  inner: leave_one_block_out    # 训练折内再留一 block 选正则强度
  standardize: train_fold       # 标准化只在训练折上估计（防泄漏 6.3 第 3 条）
  pca: [none, 50]               # 两种都报告；特征数 ≤ 50 时 pca=50 与 none 相同，跳过
ridge:
  alphas: {logspace: [-2, 6, 33]}
  inner_metric: mse
logistic:
  lambdas: {logspace: [-1, 4, 11]}    # L2 惩罚 λ（≈ 1/C）；截距不惩罚
  newton_iters: 25
  inner_metric: auc

permutation:
  n: 1000                       # 在 block 内打乱目标，整套嵌套交叉验证重跑（总纲 S9）
  within: block
