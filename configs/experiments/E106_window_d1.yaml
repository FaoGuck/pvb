# 来自 S2R 505b298 的 configs/experiments/E106_window_d1.yaml，2026-11-26 复制（机械改名：S2R_→PRJ_、包名 s2r→项目名）
# E106：D1 窗口长度扫描（总纲 7.1）。三个预训练模型 × W1/W2/W4（meanpool、末层）+ 经典特征 W05/W1
# 目的：① 模型与经典特征在同一窗口（W1）下比较（E103 是模型 W4 对经典 W1，不对等）② 窗口变长是否带来更多信息（735 等被试）
# 说明：模型要求整秒输入，S7 只提了 W4/W2/W1，所以模型没有 W05；经典特征 S6 只算了 W1/W05，所以经典没有 W2/W4
#       W4 与经典 W1 两行和 E103/E101 设置相同（同试验、同置换），用来核对可重复性，并让本实验自成一张表
# 评估与 E101/E103/E104 完全相同（同试验、同目标、同正则网格、同 1000 次置换）
# 运行：scripts/s08_probe.py --exp configs/experiments/E106_window_d1.yaml
exp_id: E106_window_d1
dataset: d1
seed: 0

trials:
  keep_column: keep_W3          # S5 方案 C 的主分析保留标记（所有窗口用同一批试验，可配对）
targets:
  y_cont:                       # 回归：block 内去漂移后的 ln MEP（S4 的 mep_resid）
    column: mep_resid
    task: regression
  y_bin:                        # 分类：在保留试验上、block 内中位数切分（高 = 1）
    column: mep_resid
    task: classification
    split: block_median

predictors:
  # ---- 经典特征（S6，data/features/d1/classical/）----
  classical_W1:                 # 与 E101 的 classical 完全相同
    window: W1
    prefixes: [pow_W1_, loc_W1_, glob_W1_, slope_W1, offset_W1]
    columns: [mu_sin, mu_cos, mu_amp]
  classical_W05:                # 同一组特征，换成脉冲前 0.5 s 计算（mu 相位与窗口无关，照样加上）
    window: W05
    prefixes: [pow_W05_, loc_W05_, glob_W05_, slope_W05, offset_W05]
    columns: [mu_sin, mu_cos, mu_amp]
  # ---- 预训练模型（S7，data/features/d1/embeddings/<dir>/sub-XXX_<窗口>_meanpool.npy，取末层）----
  reve_W1:   {type: embedding, dir: reve,    window: W1, pool: meanpool, layers: [last]}
  reve_W2:   {type: embedding, dir: reve,    window: W2, pool: meanpool, layers: [last]}
  reve_W4:   {type: embedding, dir: reve,    window: W4, pool: meanpool, layers: [last]}
  labram_W1: {type: embedding, dir: labram,  window: W1, pool: meanpool, layers: [last]}
  labram_W2: {type: embedding, dir: labram,  window: W2, pool: meanpool, layers: [last]}
  labram_W4: {type: embedding, dir: labram,  window: W4, pool: meanpool, layers: [last]}
  cbramod_W1: {type: embedding, dir: cbramod, window: W1, pool: meanpool, layers: [last]}
  cbramod_W2: {type: embedding, dir: cbramod, window: W2, pool: meanpool, layers: [last]}
  cbramod_W4: {type: embedding, dir: cbramod, window: W4, pool: meanpool, layers: [last]}

cv:
  outer: leave_one_block_out    # 6 折
  inner: leave_one_block_out    # 训练折内再留一 block 选正则强度
  standardize: train_fold       # 标准化只在训练折上估计（防泄漏 6.3 第 3 条）
  pca: [none, 50]               # 两种都报告；特征数 ≤ 50 时 pca=50 与 none 相同，跳过
ridge:
  alphas: {logspace: [-2, 6, 33]}
  inner_metric: mse
logistic:
  lambdas: {logspace: [-1, 4, 11]}    # L2 惩罚 λ（≈ 1/C）；截距不惩罚
  newton_iters: 25
  inner_metric: auc

permutation:
  n: 1000                       # 在 block 内打乱目标，整套嵌套交叉验证重跑（总纲 S9）
  within: block
