# 来自 S2R 505b298 的 configs/experiments/E107_layers_d1.yaml，2026-11-26 复制（机械改名：S2R_→PRJ_、包名 s2r→项目名）
# E107：D1 逐层探测（总纲 7.1）。三个预训练模型的每一层（W4、meanpool）
# 层号：0 = 输入嵌入（patch 编码后、第一个 Transformer 块之前），最后一层 = E103 用的末层；REVE 0–22、LaBraM 0–12、CBraMod 0–12，共 49 个预测器
# 目的：末层不一定最好（预训练目标是重建，中间层可能更像"状态"）；若某层明显超过经典特征，G1 的"缺口"就不成立
# 计算量：只做 PCA none（E103/E104/E106 里 PCA 50 与 none 几乎一样），约为 E103 的 8 倍
# 评估与 E101/E103/E104 完全相同（同试验、同目标、同正则网格、同 1000 次置换）
# 运行：scripts/s08_probe.py --exp configs/experiments/E107_layers_d1.yaml
exp_id: E107_layers_d1
dataset: d1
seed: 0

trials:
  keep_column: keep_W3          # S5 方案 C 的主分析保留标记
targets:
  y_cont:                       # 回归：block 内去漂移后的 ln MEP（S4 的 mep_resid）
    column: mep_resid
    task: regression
  y_bin:                        # 分类：在保留试验上、block 内中位数切分（高 = 1）
    column: mep_resid
    task: classification
    split: block_median

predictors:
  reve:    {type: embedding, dir: reve,    window: W4, pool: meanpool, layers: all}
  labram:  {type: embedding, dir: labram,  window: W4, pool: meanpool, layers: all}
  cbramod: {type: embedding, dir: cbramod, window: W4, pool: meanpool, layers: all}

cv:
  outer: leave_one_block_out    # 6 折
  inner: leave_one_block_out    # 训练折内再留一 block 选正则强度
  standardize: train_fold       # 标准化只在训练折上估计（防泄漏 6.3 第 3 条）
  pca: [none]                   # 只做不降维（省一半计算量）
ridge:
  alphas: {logspace: [-2, 6, 33]}
  inner_metric: mse
logistic:
  lambdas: {logspace: [-1, 4, 11]}    # L2 惩罚 λ（≈ 1/C）；截距不惩罚
  newton_iters: 25
  inner_metric: auc

permutation:
  n: 1000                       # 在 block 内打乱目标，整套嵌套交叉验证重跑（总纲 S9）
  within: block
